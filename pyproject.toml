[project]
name = "start"
version = "0.1.0"
description = ""
requires-python = "==3.13.*"
dependencies = [
    "pre-commit>=4.5.0",
    "typer[all]>=0.9.0",
    "plotext>=5.2.0",
]

[project.scripts]
caf = "src.cli:app"

[dependency-groups]
dev = [
    "ruff",
    "basedpyright",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL", "RUF"]
ignore = [
    "T201",   # Allow print statements (scripts often use them)
    "RUF001", # Allow ambiguous unicode characters (e.g. emojis in CLI output)
    "PLC0415", # Allow imports inside functions (needed for lazy loading in CLI commands)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]  # Allow magic numbers in test assertions

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
# plotext doesn't have type stubs - ignore type-related warnings for this external library
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
